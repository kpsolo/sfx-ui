name: Deploy to GitHub Pages

# Production: pushing to the `release` branch publishes the site.
# See deploy/README.md for the release process and the one-time repository setup.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Settings come from deploy/.env.pages; the repository variable (if set) overrides the token.
      - name: Build
        run: npm run build:pages
        env:
          ORIGIN_TRIAL_TOKEN: ${{ vars.ORIGIN_TRIAL_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
