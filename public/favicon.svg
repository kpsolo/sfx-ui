<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Animated with SMIL: Firefox animates SVG favicons natively. Chromium shows the first frame,
       so src/app/animatedFavicon.ts redraws the same design on a canvas there. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="6" y1="6" x2="58" y2="58">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f43f5e"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 32 32" to="360 32 32" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="6" y="6" width="52" height="52" rx="12"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#06080d" stroke="url(#g)" stroke-width="4"/>
  <g clip-path="url(#clip)">
    <rect x="-40" y="0" width="24" height="64" fill="url(#sweep)" transform="skewX(-20)">
      <animate attributeName="x" values="-40;90;90" keyTimes="0;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="32" y="39.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="url(#g)">SFX</text>
</svg>
